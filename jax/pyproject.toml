[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bspf-jax"
version = "0.1.0"
readme = "README.md"
description = "Functional JAX B-spline plus Fourier operators in one to three dimensions"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.35", "numpy>=1.24"]

[project.optional-dependencies]
slope = ["pybspf>=0.1.0", "scipy>=1.10"]
weak-ns = ["scipy>=1.10", "gmpy2>=2.1"]
rational-flow = ["scipy>=1.15", "gmpy2>=2.1"]
compression = ["scipy>=1.10"]
test = ["pytest>=8", "scipy>=1.15"]
notebook = ["jupyterlab", "matplotlib"]
air-sea = ["scipy>=1.10", "gmpy2>=2.1", "netCDF4>=1.6", "matplotlib>=3.7"]

[project.scripts]
bspf-air-sea = "bspf_jax.air_sea_platform:main"

[tool.setuptools.package-data]
bspf_jax = ["surface_exchange_LICENSE.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
