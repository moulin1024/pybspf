[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybspf"
version = "0.2.0"
description = "Functional JAX B-spline plus Fourier numerical operators"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = ["jax>=0.4.35", "numpy>=1.24"]

[project.optional-dependencies]
host = ["scipy>=1.10"]
test = ["pytest>=8", "scipy>=1.15", "build"]
notebook = ["jupyterlab", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pybspf*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/models/tests", "packages/sim/tests"]
addopts = "--import-mode=importlib"
norecursedirs = ["legacy", "build", ".git", ".claude"]
markers = ["gpu: requires a JAX GPU device", "performance: requires a quiet machine"]
