name: Air-sea research platform
on:
  push:
    paths: ['jax/**', 'experiments/air_sea/**', '.github/workflows/air-sea.yml']
  pull_request:
    paths: ['jax/**', 'experiments/air_sea/**', '.github/workflows/air-sea.yml']
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: smoke
        options: [smoke, resolution, quadrature, sensitivity, reliability]
      exchange:
        type: choice
        default: constant
        options: [constant, coare35]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './jax[air-sea,test]'
      - run: python -m pytest -q jax/tests/test_surface_exchange.py jax/tests/test_multirate.py jax/tests/test_air_sea.py jax/tests/test_air_sea_audit.py jax/tests/test_air_sea_platform.py jax/tests/test_air_sea_validation.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  experiment:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './jax[air-sea,test]'
      - run: bspf-air-sea validate --suite "$SUITE" --config "experiments/air_sea/${EXCHANGE}_24h.json" --out "build/acceptance/${SUITE}"
        env:
          SUITE: ${{ inputs.suite }}
          EXCHANGE: ${{ inputs.exchange }}
          OPENBLAS_NUM_THREADS: '1'
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: air-sea-evidence
          path: build/acceptance
